<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="bolt" x1="200" y1="80" x2="320" y2="440" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0e7ff"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#a5b4fc"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#4f46e5" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background rounded square -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="url(#bg)" filter="url(#shadow)"/>

  <!-- Subtle inner ring -->
  <rect x="40" y="40" width="432" height="432" rx="80" fill="none" stroke="url(#ring)" stroke-width="2" opacity="0.3"/>

  <!-- Lightning bolt - the core icon -->
  <path d="M288 80 L176 272 L240 272 L224 432 L336 240 L272 240 Z" fill="url(#bolt)" filter="url(#glow)"/>

  <!-- Small decorative dots -->
  <circle cx="120" cy="140" r="6" fill="#a5b4fc" opacity="0.5"/>
  <circle cx="392" cy="372" r="6" fill="#a5b4fc" opacity="0.5"/>
  <circle cx="140" cy="380" r="4" fill="#c7d2fe" opacity="0.35"/>
  <circle cx="380" cy="130" r="4" fill="#c7d2fe" opacity="0.35"/>
</svg>
